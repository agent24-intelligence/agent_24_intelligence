<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo-filled.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <!-- 영문 워드마크("Bridge Agent")용 — 본문은 계속 Pretendard, 제목만 이 폰트로 구분 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@800&display=swap" rel="stylesheet" />
    <title>Bridge Agent — AGENT:24</title>
    <script>
      // React가 마운트되기 전에 저장된 테마를 먼저 적용해서, 라이트를 선택해둔
      // 상태로 새로고침했을 때 다크가 잠깐 번쩍였다 바뀌는 걸 막는다.
      (function () {
        try {
          var saved = window.localStorage.getItem('bridge-agent-theme')
          if (saved) document.documentElement.setAttribute('data-theme', saved)
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
